
apiVersion: v1
kind: Pod
metadata:
  name: missing-resources-pod
  namespace: testing
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: zero-resources-pod
  namespace: testing
spec:
  containers:
    - name: redis
      image: redis:7-alpine
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "0"
          memory: "0"
---
apiVersion: v1
kind: Pod
metadata:
  name: partial-resources-pod
  namespace: testing
spec:
  containers:
    - name: postgres
      image: postgres:17
      resources:
        requests:
          cpu: "250m"
        limits:
          memory: "512Mi"
