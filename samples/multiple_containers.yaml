apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  namespace: testing

spec:
  containers:
    - name: frontend
      image: nginx:latest
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    - name: backend
      image: python:3.12
      resources:
         requests: "invalid"
         limits: null

