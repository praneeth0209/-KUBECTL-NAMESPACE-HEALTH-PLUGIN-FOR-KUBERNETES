apiVersion: v1
kind: Pod

metadata:
  name: multi-container-pod
  namespace: testing

spec:
  containers:
    - name: frontend
      image: nginx
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    - name: backend
      image: redis
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
